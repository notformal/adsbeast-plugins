description = "Compare a client's ad platforms on cost and return"
prompt = """
Compare the advertising platforms of this client side by side: {{args}}

Before the first tool call, load the cross-platform-comparison skill of the ADS Beast plugin (in Claude Code its name is adsbeast:cross-platform-comparison) and read it in full. Then follow its steps in order; do not make up your own sequence of calls. The first call is `whoami` on the adsbeast server, once, to check the connection. If no client was named above, list the clients and ask which one. Report amounts in the currency of the ad account, do not repeat a create or an execute call that failed, answer a `status: running` reply by telling the user it is still running and calling `get_job_result` with its `job_id` after the wait it states (never the original tool again), and show the preview and ask for confirmation before any change is submitted.
"""
