description = "Review what a client's competitors advertise"
prompt = """
Review competitor ads for this client: {{args}}

Before the first tool call, load the competitor-ads-review skill of the ADS Beast plugin (in Claude Code its name is adsbeast:competitor-ads-review) and read it in full. Then follow its steps in order; do not make up your own sequence of calls. The first call is `whoami` on the adsbeast server, once, to check the connection. If no client was named above, list the clients and ask which one. Report amounts in the currency of the ad account, do not repeat a create or an execute call that failed, and show the preview and ask for confirmation before any change is submitted.
"""
