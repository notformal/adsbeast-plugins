name: Publish to MCP Registry

# Publishes both server.json files to the official MCP Registry
# (registry.modelcontextprotocol.io). Authentication is GitHub OIDC: the
# registry trusts a token minted for this repository's workflow, so no
# secret is stored here and no personal token leaves anyone's machine.
#
# The registry refuses a version it already holds, so a run only changes
# anything after "version" in a server.json was raised.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "adsbeast/server.json"
      - "ad-spec-guard/server.json"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Validate
        run: |
          set -euo pipefail
          ./mcp-publisher validate adsbeast/server.json
          ./mcp-publisher validate ad-spec-guard/server.json

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: |
          set -uo pipefail
          status=0
          for file in adsbeast/server.json ad-spec-guard/server.json; do
            echo "::group::$file"
            if out="$(./mcp-publisher publish "$file" 2>&1)"; then
              echo "$out"
            elif echo "$out" | grep -qiE "duplicate version|already exists|cannot publish duplicate"; then
              echo "$out"
              echo "Already published at this version; nothing to do."
            else
              echo "$out"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status
